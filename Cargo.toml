[package]
name = "univers-aip-lib-storage-sqlite"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "SQLite repositories and graph storage over public Data storage Ports"
repository = "https://github.com/hsudatalks/univers-aip-libs-rs-storage-sqlite"
publish = ["univers"]
readme = "README.md"
include = ["Cargo.toml", "Cargo.lock", "README.md", "src/**", "tests/**", "scripts/**", ".cargo/config.toml"]
[workspace]
members = ["."]
resolver = "2"
[dependencies]
tracing="0.1"
log="0.4"
sqlx={version="0.8",default-features=false,features=["runtime-tokio","sqlite","uuid","chrono","json"]}
async-trait="0.1"
tokio={version="1",features=["rt","sync","time"]}
serde={version="1",features=["derive"]}
serde_json="1"
uuid={version="1",features=["v4","v5","serde"]}
chrono={version="0.4",features=["serde","clock"]}
univers-aip-contracts-data={version=">=1.0.0-rc.2, <1.0.0",registry="univers",default-features=false,features=["storage","storage-full"]}
[dev-dependencies]
tokio={version="1",features=["rt-multi-thread","macros"]}
univers-aip-contracts-operation={version="=1.0.0-rc.2",registry="univers",default-features=false,features=["task"]}
